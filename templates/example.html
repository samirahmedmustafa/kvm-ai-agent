<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastAPI App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        textarea {
            width: 100%;
            max-width: 800px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
        }

        .result table {
            border-collapse: collapse;
            width: 100%;
        }

        .result th,
        .result td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        .result pre {
            padding: 15px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h1>FastAPI Demo</h1>

    <form method="post" action="/">

        <label for="text">Enter text:</label>

        <br><br>

        <textarea
            id="text"
            name="text"
            rows="10"
            cols="60"
            placeholder="Enter something..."
            required
        ></textarea>

        <br><br>

        <button type="submit">Submit</button>

    </form>

    {% if result %}
        <div class="result">
            {{ result | safe }}
        </div>
    {% endif %}

</body>
</html>
