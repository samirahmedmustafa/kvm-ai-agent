<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        textarea { width: 100%; height: 150px; font-family: monospace; }
        button { margin-top: 0.5rem; padding: 0.5rem 1rem; }
        #result { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; background: #fafafa; }
        #tools { margin-top: 1rem; font-size: 0.9rem; color: #555; }
        #tools ul { list-style: none; padding-left: 0; }
        #tools li { display: inline-block; margin-right: 1rem; }
    </style>
</head>
<body>
    <h1>Agent Demo</h1>

    <!-- The form -->
    <form id="promptForm">
        <textarea id="prompt" name="text" placeholder="Enter your prompt here…"></textarea>
        <br>
        <button type="submit">Submit</button>
    </form>

    <!-- Result area – will be replaced by the script -->
    <div id="result">
      <!-- 1️⃣  The answer text (no button inside) -->
      <pre id="resultText">{{ result | safe }}</pre>
    
      <!-- 2️⃣  The copy button -->
      <button onclick="copyText()">Copy Text</button>
    </div>


    <!-- Tools list (always visible) -->
    <div id="tools">
        <strong>Available tools:</strong>
        <ul id="toolList"></ul>
    </div>

    <script>
        // ------------------------------------------------------------------
        // 1️⃣  Populate the tools list (the server passes it in the template)
        // ------------------------------------------------------------------
        const tools = {{ tools | default([]) | tojson | safe }};
        console.log('Tools:', tools);

        const toolListEl = document.getElementById('toolList');
        tools.forEach(t => {
            const li = document.createElement('li');
            li.textContent = t;
            toolListEl.appendChild(li);
        });

        // ------------------------------------------------------------------
        // 2️⃣  Handle form submission asynchronously
        // ------------------------------------------------------------------
        const form = document.getElementById('promptForm');
        const resultEl = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();                     // stop normal form submit
            resultEl.innerHTML = '<em>Processing…</em>'; // give instant feedback

            const formData = new FormData(form);

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`Server error: ${err}`);
                }

                // The server returns the same template again, but with
                // a "result" variable.  We only need that part.
                const html = await response.text();

                // Create a temporary DOM node to extract the #result content
                const temp = document.createElement('div');
                temp.innerHTML = html;
                const newResult = temp.querySelector('#result');

                // Replace the old result with the new one
                resultEl.innerHTML = newResult.innerHTML;
            } catch (err) {
                resultEl.innerHTML = `<span style="color:red;">${err.message}</span>`;
            }
        });


	async function copyText() {
	    const textEl = document.getElementById('resultText');
	
	    if (!textEl) {
	        console.error('Result text element not found.');
	        return;
	    }
	
	    const textToCopy = textEl.textContent || textEl.innerText || '';
	
	    if (!textToCopy.trim()) {
	        console.warn('There is no text to copy.');
	        return;
	    }
	
	    try {
	        // Preferred method: modern Clipboard API
	        if (navigator.clipboard && window.isSecureContext) {
	            await navigator.clipboard.writeText(textToCopy);
	        } else {
	            // Fallback for HTTP or unavailable Clipboard API
	            const textarea = document.createElement('textarea');
	            textarea.value = textToCopy;
	            textarea.style.position = 'fixed';
	            textarea.style.left = '-9999px';
	            textarea.setAttribute('readonly', '');
	
	            document.body.appendChild(textarea);
	            textarea.select();
	            textarea.setSelectionRange(0, textarea.value.length);
	
	            const copied = document.execCommand('copy');
	            document.body.removeChild(textarea);
	
	            if (!copied) {
	                throw new Error('Browser could not copy the text.');
	            }
	        }
	
	        console.info('Text copied to clipboard!');
	    } catch (err) {
	        console.error('Failed to copy text:', err);
	        alert('Unable to copy text. Check browser permissions or use HTTPS.');
	    }
	}
    </script>
</body>
</html>
